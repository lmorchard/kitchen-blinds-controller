; Hunter Douglas PowerView Gen 2 blind controller
; Wemos D1 Mini (ESP8266) + nRF24L01+
;
; Pins (match RFPowerView's examples):
;   CE = D1 (GPIO5), CSN = D8 (GPIO15), IRQ = D2 (GPIO4)
;
[platformio]
default_envs = firmware
extra_configs = secrets.ini   ; OTA password (git-ignored; see secrets.example.ini)

; Production firmware:
;   pio run -e firmware     -t upload   ; flash over USB
;   pio run -e firmware_ota -t upload   ; flash over Wi-Fi (kitchen-blind.local)
;
; Bench tools, each its own environment, e.g.:
;   pio run -e smoketest -t upload   ; SPI check / printPrettyDetails()
;   pio run -e listen    -t upload   ; decode our remote's button presses
;   pio run -e txtest    -t upload   ; send Open/Stop/Favorite from serial keys
;
; RFPowerView is vendored in lib/RFPowerView with a CRC fix (see its
; README.local.md); these are its upstream dependencies.

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D RF_CE_PIN=5
    -D RF_CS_PIN=15
    -D RF_IRQ_PIN=4
lib_deps =
    nrf24/RF24@1.4.8
    rlogiacco/CircularBuffer@1.3.3

[env:smoketest]
build_src_filter = +<smoketest.cpp>

[env:discover]
build_src_filter = +<discover.cpp>
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=115200

; Same as discover, but dumps every raw frame at 921600 baud for offline analysis
[env:discover_raw]
build_src_filter = +<discover.cpp>
monitor_speed = 921600
build_flags =
    ${env.build_flags}
    -D RAW_DUMP
    -D SERIAL_BAUD=921600

; Sweep all 126 channels for RF energy to find the remote's channel
[env:scanner]
build_src_filter = +<scanner.cpp>
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=115200

; Deterministic search for the remote's RF_ID on channel 7
[env:findid]
build_src_filter = +<findid.cpp>
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=115200

; Listen on our known network (RF_ID 0x0817) with the corrected CRC
[env:listen]
build_src_filter = +<listen.cpp>
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=115200
    -D RF_ID=0x0817

; Transmit test: send Open/Stop/Favorite to group 1 from serial keystrokes
[env:txtest]
build_src_filter = +<txtest.cpp>
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=115200
    -D RF_ID=0x0817
    -D REMOTE_ID=0x1D84
    -D BLIND_GROUP=1

; ---------------------------------------------------------------------------
; Production firmware: MQTT + web UI + mDNS + OTA
[firmware_common]
build_src_filter = +<firmware.cpp>
build_flags =
    ${env.build_flags}
    -D RF_ID=0x0817
    -D REMOTE_ID=0x1D84
    -D BLIND_GROUP=1
    -D RFPOWERVIEW_POLL_IRQ
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

[env:firmware]
build_src_filter = ${firmware_common.build_src_filter}
build_flags = ${firmware_common.build_flags}
lib_deps = ${firmware_common.lib_deps}

[env:firmware_ota]
build_src_filter = ${firmware_common.build_src_filter}
build_flags = ${firmware_common.build_flags}
lib_deps = ${firmware_common.lib_deps}
upload_protocol = espota
upload_port = kitchen-blind.local
upload_flags =
    --auth=${ota.password}
